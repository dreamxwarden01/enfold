# Common tasks shared by the platform Taskfile. Trimmed from the Wails
# template to what a Windows-only, npm-only project needs.
version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Installs the frontend's dependencies from the lockfile
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "npm is required (https://nodejs.org)"
    cmds:
      - npm ci

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Builds the frontend into frontend/dist
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      - exclude: dist/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}} -q
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    summary: Generates the TypeScript bindings and models (committed; a diff is a review item)
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts -i

  generate:icons:
    summary: Draws the application's icon from internal/brand into build/windows/icon.ico and build/appicon.png
    # Both files are generated and ignored, never kept in the repository: a
    # fresh clone makes them on its first build. tools/appicon writes the .ico
    # itself, every size drawn for its own pixels, so `wails3 generate icons`
    # (which scaled one 1024 px PNG down to each entry) is no longer used.
    run: once
    sources:
      - internal/brand/*.go
      - exclude: internal/brand/*_test.go
      - tools/appicon/*.go
    generates:
      - build/appicon.png
      - build/windows/icon.ico
    cmds:
      - go run ./tools/appicon -ico build/windows/icon.ico -png build/appicon.png

  dev:frontend:
    summary: Runs Vite in development mode
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Regenerates the build assets from build/config.yml
    # This is how `fileAssociations:` in config.yml reaches the wails.associateFiles
    # macro in windows/nsis/wails_tools.nsh. Mind three side effects, all verified
    # against wails3 beta.16/beta.20 (the templates are identical between them):
    #   * it extracts the WHOLE template tree, so it creates build/darwin,
    #     build/ios and build/linux, which this Windows-only repo does not keep --
    #     delete them again afterwards;
    #   * it overwrites windows/info.json, replacing FileDescription "Enfold" with
    #     config.yml's long `description`, and drops both that file's and
    #     wails.exe.manifest's trailing newline -- revert those two;
    #   * windows/nsis/project.nsi is NOT a template and is never touched.
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
