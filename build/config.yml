# Wails project configuration. `info` feeds the Windows version resource and
# the NSIS installer (build/windows/info.json, wails.exe.manifest, nsis);
# after changing it, run `wails3 task common:update:build-assets`.
version: '3'

info:
  companyName: "dreamxwarden01"
  productName: "Enfold"
  productIdentifier: "com.dreamxwarden01.enfold"
  description: "Compression and encryption archives, unlocked by a YubiKey."
  copyright: "(c) 2026, dreamxwarden01"
  comments: "https://github.com/dreamxwarden01/enfold"
  version: "0.1.0"

# Dev mode. A dev build has debug logging, DevTools and the native context
# menu on: point it only at a throwaway vault (docs/APP.md §1).
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
      - docs
      - testdata
    file:
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary

# The one association Enfold claims (docs/APP.md 14, decision 3).
#   `name`        the ProgID: the key name under HKCU\Software\Classes and the
#                 value written under .efd. It is an identifier, not prose -
#                 alphanumerics and dots, no spaces, which is why it is
#                 Enfold.efd and not "Enfold archive".
#   `description` the ProgID key's default value, which is the friendly type
#                 name Explorer shows in its Type column: "Enfold archive".
#   `iconName`    an .ico in build/windows (icon.ico, the application's own,
#                 generated by common:generate:icons); the installer packs it
#                 and writes it to $INSTDIR\icon.ico as the class's DefaultIcon.
# `wails3 task common:update:build-assets` turns this into the
# wails.associateFiles macro in build/windows/nsis/wails_tools.nsh.
fileAssociations:
  - ext: efd
    name: "Enfold.efd"
    description: "Enfold archive"
    iconName: icon

other:
